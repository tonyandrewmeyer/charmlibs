name: SBOM and secscan

on:
  workflow_call:
    inputs:
      package:
        description: Package path (e.g. "pathops").
        required: true
        type: string
      name:
        description: PyPI distribution name (e.g. "charmlibs-pathops").
        required: true
        type: string
      tag:
        description: >
          Git tag being published. Left empty for test.pypi.org runs, which
          skip the scan (nothing to scan on the real store yet).
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  scan:
    name: SBOM and secscan (${{ inputs.name }})
    if: ${{ inputs.tag != '' && inputs.name != '' }}
    # Self-hosted runner is required for access to the internal SBOM and
    # secscan services.
    runs-on: [self-hosted, self-hosted-linux-amd64-jammy-private-endpoint-medium]
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libapt-pkg-dev
          sudo apt install -y python3-apt
      - name: Checkout security scanner
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          repository: canonical/sbomber
          path: scanner
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      - name: Install secscan cli
        run: |
          sudo snap install canonical-secscan-client
          sudo snap connect canonical-secscan-client:home system:home
      - name: Generate sbomber manifest
        env:
          PACKAGE_NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          cat > .sbomber-manifest.yaml <<EOF
          clients:
            sbom:
                service_url: https://sbom-request.canonical.com
                department: charm_engineering
                email: tony.meyer@canonical.com
                team: charm_tech
            secscan: {}

          artifacts:
            - name: '${PACKAGE_NAME}'
              type: 'wheel'
              ssdlc_params:
                  name: '${PACKAGE_NAME}'
                  version: ''
                  channel: 'stable'
          EOF
      - name: Prepare the artifacts
        run: |
          cd scanner
          ./sbomber prepare ../.sbomber-manifest.yaml
      - name: Submit the artifacts
        run: |
          cd scanner
          ./sbomber submit
      - name: Wait for the scans to finish
        run: |
          cd scanner
          ./sbomber poll --wait --timeout 30
      - name: Download the reports
        run: |
          cd scanner
          ./sbomber download
      - name: Upload reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: secscan-report-${{ inputs.package }}
          path: ./scanner/reports/
          if-no-files-found: error
