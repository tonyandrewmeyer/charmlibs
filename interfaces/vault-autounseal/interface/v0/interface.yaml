name: vault-autounseal

internal: true
version: 0
status: published
summary: Auto-unseal a Vault with another Vault's transit backend.
description: |
  The `vault-autounseal` interface allows a Vault charm to auto-unseal using the transit backend of another Vault.
  The provider charm creates an encryption key and AppRole credentials for the requirer, and shares them, with the credentials in a Juju secret.
  The requirer configures its Vault to use them to unseal.

providers:
  - name: vault
    url: https://github.com/canonical/vault-k8s-operator
  - name: vault-k8s
    url: https://github.com/canonical/vault-k8s-operator

requirers:
  - name: vault-k8s
    url: https://github.com/canonical/vault-k8s-operator
  - name: vault
    url: https://github.com/canonical/vault-k8s-operator

maintainer: tls
