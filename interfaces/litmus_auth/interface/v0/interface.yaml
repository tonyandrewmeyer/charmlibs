name: litmus_auth
version: 0
status: draft
lib: litmus-libs
summary: Exchange gRPC server endpoints for communication between Litmus auth and backend charms.
description: |
  The `litmus_auth` interface enables communication between the Litmus auth and Litmus backend charms.
  The provider (the auth server) and the requirer (the backend server) each publish their gRPC server's endpoint, and whether it accepts TLS connections.

providers:
  - name: litmus-auth-k8s
    url: https://github.com/canonical/litmus-operators

requirers:
  - name: litmus-backend-k8s
    url: https://github.com/canonical/litmus-operators

maintainer: tracing-and-profiling
