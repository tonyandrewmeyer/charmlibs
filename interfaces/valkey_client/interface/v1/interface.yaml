name: valkey_client
version: 1
status: published
lib: dpcharmlibs.interfaces
summary: Access Valkey databases with credentials and TLS configuration.
description: |
  The `valkey_client` interface allows charms to access Valkey databases with user-specific credentials and TLS configuration.
  The provider charm creates Valkey users and permissions based on requirer requests, while the requirer charm shares the keys and Pub/Sub channels it wants to access.

providers:
  - name: valkey
    url: https://github.com/canonical/valkey-operator
    branch: 9/edge

requirers:
  - name: data-integrator
    url: https://github.com/canonical/data-integrator
  - name: discourse-k8s
    url: https://github.com/canonical/discourse-k8s-operator
  - name: mediawiki-k8s
    url: https://github.com/canonical/mediawiki-k8s-operator

maintainer: data-nosql
