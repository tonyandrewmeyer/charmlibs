name: velero_backup_config
version: 0
status: published
lib: charms.velero_libs.velero_backup_config
summary: Tell the Velero Operator what Kubernetes data to back up.
description: |
  The `velero_backup_config` interface allows a client charm to tell the Velero Operator charm what Kubernetes data to back up, without the client needing elevated permissions in the cluster.
  The provider charm (the client) provides a backup specification, including the namespaces and resource kinds to include or exclude, and the requirer charm (the Velero Operator) uses it to create Velero backups and schedules.

providers:
  - name: mlmd-operator
    url: https://github.com/canonical/mlmd-operator
    branch: main
  - name: minio-operator
    url: https://github.com/canonical/minio-operator
    branch: main
  - name: kubeflow-profiles-operator
    url: https://github.com/canonical/kubeflow-profiles-operator
    branch: main
  - name: velero-integrator
    url: https://github.com/canonical/velero-integrator

requirers:
  - name: velero-operator
    url: https://github.com/canonical/velero-operator

maintainer: analytics
