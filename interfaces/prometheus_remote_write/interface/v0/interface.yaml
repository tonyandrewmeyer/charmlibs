name: prometheus_remote_write
version: 0
status: published
lib: charms.prometheus_k8s.prometheus_remote_write
summary: Send Prometheus metrics to a remote write endpoint.
description: |
  The `prometheus_remote_write` interface supports sending metrics to a server that accepts the Prometheus remote write protocol.
  The provider publishes the remote write endpoint of each of its units, and the alert rule encodings that it can read.
  The requirer sends metrics to every endpoint, and publishes its alert and recording rules, which the provider evaluates.

providers:
  - name: prometheus-k8s
    url: https://github.com/canonical/prometheus-k8s-operator
  - name: mimir-coordinator-k8s
    url: https://github.com/canonical/mimir-operators

requirers:
  - name: opentelemetry-collector-k8s
    url: https://github.com/canonical/opentelemetry-collector-k8s-operator
  - name: grafana-agent-k8s
    url: https://github.com/canonical/grafana-agent-k8s-operator
  - name: loki-k8s
    url: https://github.com/canonical/loki-k8s-operator

maintainer: observability-core
