name: smtp
version: 0
status: published
lib: charmlibs.interfaces.smtp
summary: Connect to an SMTP server.
description: |
  The `smtp` interface allows charms to connect to an SMTP server.
  The provider charm provides the SMTP details, including a password or a secret that contains one, so that the requirer can connect.

providers:
  - name: smtp-integrator
    url: https://github.com/canonical/smtp-integrator-operator

requirers:
  []

maintainer: platform-engineering-emea
