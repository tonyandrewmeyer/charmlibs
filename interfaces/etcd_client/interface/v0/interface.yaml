name: etcd_client
version: 0
status: published
lib: charms.data_platform_libs.data_interfaces
summary: Access etcd clusters with credentials and TLS configuration.
description: |
  The `etcd_client` interface allows charms to access etcd clusters with user-specific credentials and TLS configuration.
  The provider charm creates etcd users and roles based on requirer requests, while the requirer charm shares certificate information and key access prefixes.

providers:
  - name: charmed-etcd
    url: https://github.com/canonical/charmed-etcd-operator
    branch: 3.6/edge

requirers:
  - name: data-integrator
    url: https://github.com/canonical/data-integrator

maintainer: data-nosql
