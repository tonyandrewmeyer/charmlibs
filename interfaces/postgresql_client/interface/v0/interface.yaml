name: postgresql_client
version: 0
status: published
lib: charms.data_platform_libs.data_interfaces
summary: Access PostgreSQL databases with unique credentials.
description: |
  The `postgresql_client` interface allows charms to access PostgreSQL databases with unique, relation-specific credentials, transmitted via Juju secrets when both sides support them.
  The requirer charm requests a database (or a prefix that matches several databases), and optionally extra roles; the provider charm creates a database user, and the database if needed, and provides the credentials and connection details.
  Some providers, such as PgBouncer on machines, are subordinate charms that offer a local service within a principal unless the requirer asks for external connectivity.
  It follows the same pattern as the other `<database>_client` interfaces, such as `mysql_client` and `mongodb_client`.

providers:
  - name: postgresql
    url: https://github.com/canonical/postgresql-operator
  - name: postgresql-k8s
    url: https://github.com/canonical/postgresql-k8s-operator
  - name: pgbouncer
    url: https://github.com/canonical/pgbouncer-operator
  - name: pgbouncer-k8s
    url: https://github.com/canonical/pgbouncer-k8s-operator

requirers:
  - name: pgbouncer
    url: https://github.com/canonical/pgbouncer-operator
  - name: pgbouncer-k8s
    url: https://github.com/canonical/pgbouncer-k8s-operator
  - name: data-integrator
    url: https://github.com/canonical/data-integrator

maintainer: data-postgresql
