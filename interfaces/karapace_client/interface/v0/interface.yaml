name: karapace_client
version: 0
status: published
lib: charms.data_platform_libs.data_interfaces
summary: Access Karapace schema registry services.
description: |
  The `karapace_client` interface allows charms to access a Karapace schema registry with credentials of their own.
  The requirer charm asks for access to a subject as a `user` or an `admin` client, and the provider charm creates a Karapace user with the matching access and shares the credentials and server addresses.
  Users are granted read access to the subject that they asked for, and admins are granted full access to every subject.

providers:
  - name: karapace
    url: https://github.com/canonical/karapace-operator
  - name: karapace-k8s
    url: https://github.com/canonical/karapace-k8s-operator

requirers:
  - name: kafka-ui
    url: https://github.com/canonical/kafka-ui-operator
  - name: kafka-ui-k8s
    url: https://github.com/canonical/kafka-ui-k8s-operator

maintainer: data-bigdata
