name: opencti_connector
version: 0
status: published
lib: charms.opencti.opencti_connector
summary: Connect OpenCTI connectors to an OpenCTI instance.
description: |
  The `opencti_connector` interface connects OpenCTI connector charms to an OpenCTI charm.
  Each provider is a connector, and shares its name and connector type.
  The requirer is OpenCTI, which creates an OpenCTI user for each connector and shares the OpenCTI URL and a Juju secret with that user's API token.

