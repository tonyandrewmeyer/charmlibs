name: wazuh_api_client
version: 0
status: published
lib: charms.wazuh_server.wazuh_api
summary: Connect to a Wazuh server's REST API.
description: |
  The `wazuh_api_client` interface allows charms to connect to the REST API of a Wazuh server.
  The provider charm manages access to the server, and shares the API endpoint and a Juju secret with the credentials to use.

providers:
  - name: wazuh-server
    url: https://github.com/canonical/wazuh-server-operator

requirers:
  - name: wazuh-dashboard
    url: https://github.com/canonical/wazuh-dashboard-operator

maintainer: platform-engineering
