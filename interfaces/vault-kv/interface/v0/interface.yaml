name: vault-kv
version: 0
status: published
lib: charms.vault_k8s.vault_kv
summary: Securely share Vault credentials to interact with the Vault Key-Value (KV) backend.
description: |
  The `vault-kv` interface allows charms to securely request and receive the credentials needed to interact with the Key-Value (KV) backend of Vault.
  The requirer charm requests a KV mount and credentials for each unit, and the provider charm creates them and shares them, with the credentials in Juju secrets.

providers:
  - name: vault-k8s
    url: https://github.com/canonical/vault-k8s-operator
  - name: vault
    url: https://github.com/canonical/vault-k8s-operator
requirers: []

maintainer: tls
