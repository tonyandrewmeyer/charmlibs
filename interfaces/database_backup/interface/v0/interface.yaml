name: database_backup
version: 0
status: draft
summary: Manage database backup and restore operations.
description: |
  The `database_backup` interface allows a database backup manager charm to coordinate backup and restore operations with database charms.
  The requirer charm (the backup manager) requests backup and restore jobs, with the storage to use for each, and the provider charm (the database) runs them and reports their status.
  The Juju admin triggers a backup or restore with an action on the backup manager, and will eventually be able to schedule periodic backups there.

