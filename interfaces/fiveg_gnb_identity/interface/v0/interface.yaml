name: fiveg_gnb_identity
internal: true

version: 0
status: retired
lib: charms.sdcore_gnbsim_k8s.fiveg_gnb_identity
summary: Share the name and TAC of a 5G gNodeB.
description: |
  Within 5G, the identity of the gNodeB (a 5G base station) needs to be known by other components.
  The `fiveg_gnb_identity` interface allows a gNodeB to share its name and TAC (Tracking Area Code).
  In a typical 5G network, the provider of this interface would be a gNodeB, and the requirer would be the NMS (Network Management System).
  The charms that used this interface have replaced it with `fiveg_core_gnb`.

providers:
  - name: sdcore-gnbsim-k8s
    url: https://github.com/canonical/sdcore-gnbsim-k8s-operator
requirers:
  - name: sdcore-nms-k8s
    url: https://github.com/canonical/sdcore-nms-k8s-operator

maintainer: charmlibs-maintainers
