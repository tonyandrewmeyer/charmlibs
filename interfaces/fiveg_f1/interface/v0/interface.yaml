name: fiveg_f1
internal: true

version: 0
status: retired
lib: charms.oai_ran_cu_k8s.fiveg_f1
summary: Connect a 5G DU to a CU over the F1 interface.
description: |
  Within 5G RAN (Radio Access Network) architecture, the Functional Split (F1) interface carries the communication between the Central Unit (CU) and the Distributed Unit (DU).
  The `fiveg_f1` interface allows a DU to connect to a CU over F1.
  The provider (the CU) provides the IP address and port that it uses for F1 traffic, and the TAC (Tracking Area Code) and PLMNs (Public Land Mobile Networks) that it is configured with.
  The requirer (the DU) provides the port that it uses for F1 traffic.

