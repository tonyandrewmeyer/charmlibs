name: mimir_cluster
internal: true
version: 0
status: published
lib: coordinated-workers
summary: Mimir coordinator and worker charm communication.
description: |
  The `mimir_cluster` interface supports communication between the [mimir-coordinator-k8s](https://charmhub.io/mimir-coordinator-k8s) and [mimir-worker-k8s](https://charmhub.io/mimir-worker-k8s) charms in a distributed Mimir deployment.
  Each worker application publishes its roles, and each worker unit its address and topology, so that they can join the cluster.
  The coordinator replies with the Mimir configuration that the workers must run with, and other configuration for the worker charm.

providers:
  - name: mimir-coordinator-k8s
    url: https://github.com/canonical/mimir-operators

requirers:
  - name: mimir-worker-k8s
    url: https://github.com/canonical/mimir-operators

maintainer: observability
