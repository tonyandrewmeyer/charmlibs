name: pyroscope_cluster
internal: true
version: 0
status: published
lib: coordinated-workers
summary: Pyroscope coordinator and worker charm communication.
description: |
  The `pyroscope_cluster` interface supports communication between the [pyroscope-coordinator-k8s](https://charmhub.io/pyroscope-coordinator-k8s) and [pyroscope-worker-k8s](https://charmhub.io/pyroscope-worker-k8s) charms in a distributed Pyroscope deployment.
  Each worker application publishes its role, and each worker unit its address and topology, so that they can join the cluster.
  The coordinator replies with the Pyroscope configuration that the workers must run with, and other configuration for the worker charm.

providers:
  - name: pyroscope-coordinator-k8s
    url: https://github.com/canonical/pyroscope-operators

requirers:
  - name: pyroscope-worker-k8s
    url: https://github.com/canonical/pyroscope-operators

maintainer: tracing-and-profiling
