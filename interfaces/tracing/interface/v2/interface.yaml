name: tracing
version: 2
status: published
lib: charmlibs.interfaces.tracing
summary: Request endpoints for pushing trace data.
description: |
  The `tracing` interface supports push-based tracing.
  The requirer publishes the list of protocols it wants to use to send traces.
  The provider replies with an endpoint for each requested protocol that it supports, omitting those it does not support.

providers:
  - name: tempo-coordinator-k8s
    url: https://github.com/canonical/tempo-operators
  - name: opentelemetry-collector-k8s
    url: https://github.com/canonical/opentelemetry-collector-k8s-operator

requirers:
  - name: pyroscope-coordinator-k8s
    url: https://github.com/canonical/pyroscope-operators
  - name: opentelemetry-collector-k8s
    url: https://github.com/canonical/opentelemetry-collector-k8s-operator

maintainer: tracing-and-profiling
