name: tls-certificates
version: 0
status: retired
summary: Request TLS certificates, with the provider generating the private keys.
description: |
  The `tls-certificates` interface allows charms to request and receive TLS certificates.
  The requirer charm asks for server or client certificates by common name, and the provider charm creates each certificate and its private key, and shares them with the CA certificate.
  Version 1 replaces this version, so that private keys aren't shared in the relation data.

providers:
  - name: vault
    url: https://www.github.com/openstack/charm-vault
  - name: tls-certificates-operator
    url: https://github.com/canonical/manual-tls-certificates-operator

requirers:
  - name: keystone
    url: https://www.github.com/openstack/charm-keystone
  - name: nova-cloud-controller
    url: https://www.github.com/openstack/charm-nova-cloud-controller
  - name: cinder
    url: https://www.github.com/openstack/charm-cinder
  - name: neutron-api
    url: https://www.github.com/openstack/charm-neutron-api
  - name: glance
    url: https://www.github.com/openstack/charm-glance
  - name: charm-ceph-dashboard
    url: https://www.github.com/openstack/charm-ceph-dashboard

maintainer: tls
