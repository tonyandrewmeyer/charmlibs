name: tls-certificates
version: 1
status: published
lib: charmlibs.interfaces.tls_certificates
summary: Securely request TLS certificates.
description: |
  The `tls-certificates` interface allows charms to securely request and receive TLS certificates.
  The requirer charm is responsible for its private key and defining its certificate signing requests (CSRs).
  The provider charm delivers the certificate for each request, including the CA chain and CA certificate, or an error that explains why it couldn't.

providers:
  - name: self-signed-certificates
    url: https://github.com/canonical/self-signed-certificates-operator
  - name: lego
    url: https://github.com/canonical/lego-operator
  - name: manual-tls-certificates
    url: https://github.com/canonical/manual-tls-certificates-operator
  - name: vault-k8s
    url: https://github.com/canonical/vault-k8s-operator
  - name: vault
    url: https://github.com/canonical/vault-k8s-operator
requirers:
  - name: vault-k8s
    url: https://github.com/canonical/vault-k8s-operator
  - name: vault
    url: https://github.com/canonical/vault-k8s-operator

maintainer: tls
