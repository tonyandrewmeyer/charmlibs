name: cos_agent
internal: true
version: 0
status: published
lib: charms.grafana_agent.cos_agent
summary: Send several kinds of telemetry from a machine charm to a subordinate telemetry agent.
description: |
  The `cos_agent` interface allows machine charms to send telemetry, such as metrics, logs, dashboards, and alert rules, to the [opentelemetry-collector](https://charmhub.io/opentelemetry-collector) or [grafana-agent](https://charmhub.io/grafana-agent) subordinate charms, over a single relation.
  The provider is the principal charm, and describes what to scrape, which snap log slots to read, and its alert rules and dashboards.
  The requirer is the subordinate charm, which forwards all of that to COS, and replies with the tracing receivers that the provider requested.

providers:
  - name: zookeeper
    url: https://github.com/canonical/zookeeper-operator
  - name: kafka
    url: https://github.com/canonical/kafka-operator

requirers:
  - name: opentelemetry-collector
    url: https://github.com/canonical/opentelemetry-collector-operator
  - name: grafana-agent
    url: https://github.com/canonical/grafana-agent-operator

maintainer: observability
