name: azure_service_principal
version: 0
status: published
lib: charms.azure_auth_integrator.azure_service_principal
summary: Get Microsoft Entra ID service principal credentials.
description: |
  The `azure_service_principal` interface allows charms to get the service principal credentials that they need to access Microsoft Entra ID objects, such as Azure storage.
  The provider charm supplies the subscription and tenant IDs, and a Juju secret that contains the client ID and client secret.

providers:
  - name: azure-auth-integrator
    url: https://github.com/canonical/azure-auth-integrator

requirers:
  - name: velero-operator
    url: https://github.com/canonical/velero-operator

maintainer: data
