name: milter
summary: Provide or consume a mail filter.
description: |
  The `milter` interface allows charms to connect to a charm serving as a mail filter (milter).
  Each provider unit shares the port that its milter listens on, and the requirer combines it with that unit's address to connect.

version: 0
status: published

providers:
  - name: opendkim
    url: https://github.com/canonical/mailserver-operators/tree/main/opendkim-operator

requirers:
  - name: postfix-relay
    url: https://github.com/canonical/mailserver-operators/tree/main/postfix-relay-operator

maintainer: platform-engineering
