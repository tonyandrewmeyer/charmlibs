name: grafana_datasource
internal: true
version: 0
status: published
lib: charms.grafana_k8s.grafana_source
summary: Provide Grafana datasources.
description: |
  The `grafana_datasource` interface supports adding servers that Grafana can query as datasources, such as Prometheus, Loki, or Tempo.
  The provider publishes the type of the datasource, and the URL of each unit's server, a single URL for the whole application, or both.
  The requirer adds the datasources to Grafana, and replies with a unique ID for the Grafana application and the UIDs of the datasources, which the provider can share with other charms for correlation.

providers:
  - name: prometheus-k8s
    url: https://github.com/canonical/prometheus-k8s-operator
  - name: loki-k8s
    url: https://github.com/canonical/loki-k8s-operator
  - name: tempo-coordinator-k8s
    url: https://github.com/canonical/tempo-operators
  - name: mimir-coordinator-k8s
    url: https://github.com/canonical/mimir-operators

requirers:
  - name: grafana-k8s
    url: https://github.com/canonical/grafana-k8s-operator

maintainer: observability
